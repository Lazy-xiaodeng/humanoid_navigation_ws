scancontext_global_localizer:
  ros__parameters:
    # Fill these in when enabling the sidecar.
    database_path: ""
    pcd_map_path: ""

    # /fast_lio/cloud_registered is already in Fast-LIO camera_init/world.
    # The node transforms it back to body-local using /odom before computing
    # Scan Context, then uses the resulting local cloud for GICP against hall.pcd.
    cloud_topic: "/fast_lio/cloud_registered"
    odom_topic: "/odom"
    cloud_frame_mode: "registered"
    # The sidecar pose is in Fast-LIO camera_init coordinates. Do not publish it
    # directly to Nav2 /initialpose unless you add the camera_init -> ROS map conversion.
    map_frame: "camera_init"

    status_topic: "/scancontext_global_localization/candidates"
    best_pose_topic: "/scancontext_global_localization/best_pose"
    initialpose_topic: "/initialpose"

    num_sectors: 90
    num_rings: 24
    max_range: 60.0
    min_range: 0.8
    lateral_search_ratio: 0.1

    # Fast-LIO in this robot uses a non-ROS body convention:
    #   x = left, y = down, z = backward.
    # Scan Context needs two horizontal axes and one upward height axis, so the
    # default is horizontal x/z and vertical -y. If the input cloud is already
    # converted to a standard ROS frame, use horizontal_axis_1=0,
    # horizontal_axis_2=1, vertical_axis=2, vertical_sign=1.0.
    horizontal_axis_1: 0
    horizontal_axis_2: 2
    vertical_axis: 1
    vertical_sign: -1.0

    top_k: 5
    ring_candidates: 30
    sc_distance_threshold: 0.25
    enable_odom_consistency_gate: true
    max_odom_consistency_distance: 1.0
    max_cloud_odom_time_diff_sec: 0.35
    enable_candidate_confidence_gate: true
    min_sc_distance_gap: 0.03
    max_ambiguous_candidate_distance: 2.0
    max_refined_odom_consistency_distance: 1.5
    voxel_leaf_size: 0.25
    min_cloud_points: 800

    # Sidecar defaults: query only when the trigger service is called, and do
    # not publish /initialpose unless explicitly enabled.
    query_on_cloud: false
    query_period_sec: 0.0
    publish_initialpose: false

    enable_gicp_refinement: true
    gicp_max_iterations: 50
    gicp_max_correspondence_distance: 2.0
    gicp_fitness_threshold: 0.6

    # Full-map recovery is intentionally separate from the normal trigger.
    # Normal trigger is odom-gated and prevents RViz jumps. This service may
    # search globally, but publishes a pose only after strict GICP and repeated
    # agreement across recent trigger calls.
    global_recovery_top_k: 15
    global_recovery_ring_candidates: 80
    global_recovery_service: "/scancontext_global_localization/trigger_global"
    global_recovery_sc_distance_threshold: 0.25
    global_recovery_gicp_fitness_threshold: 0.09
    global_recovery_min_gicp_fitness_gap: 0.02
    global_recovery_same_solution_xy_tolerance: 0.5
    global_recovery_same_solution_yaw_tolerance: 0.35
    global_recovery_required_consistent_results: 4
    global_recovery_consistency_window: 8
    global_recovery_consistency_xy_tolerance: 0.5
    global_recovery_consistency_yaw_tolerance: 0.25
    global_recovery_observation_max_age_sec: 20.0
    # Startup global recovery can match repeated corridors. Keep ambiguity gate
    # enabled; NDT accepted alone cannot prove the candidate is globally correct.
    global_recovery_enable_candidate_confidence_gate: true
    # 0 disables odom gating in full-map recovery. Correctness is instead
    # enforced by multi-frame agreement and strict GICP.
    global_recovery_max_refined_odom_consistency_distance: 0.0
