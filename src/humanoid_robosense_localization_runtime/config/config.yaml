# msg callback topic
lidar_topic: "/fast_lio/cloud_registered"
rel_pose_topic: "/odom"
abs_pose_topic: "/odom"
# consume the same FastLIO topics recorded in nav_drift_test bags
convert_fastlio_odom_to_base: true
convert_registered_cloud_to_body: true
registered_cloud_odom_sync_tolerance_sec: 0.15
fastlio_odom_camera_xyz: [0.0, 0.0, 0.0]
fastlio_odom_camera_quat_xyzw: [-0.5, -0.5, 0.5, 0.5]
fastlio_body_base_xyz: [0.004, 1.215, 0.072]
fastlio_body_base_quat_xyzw: [0.5, 0.5, -0.5, 0.5]
# map -> odom is published exclusively by prior_map_odom_bridge.
map_frame_id: "map"
odom_frame_id: "odom"
base_frame_id: "base_footprint"
tf_odom_cache_duration_sec: 5.0
tf_max_interpolation_gap_sec: 0.25
debug_print: false
#map pcd path
map_path: /map/hall_open3d_grounded.pcd
#init position
init_position: [0.035185, 0.087588, 0.0] #[0.0, 0.0, 0.0] # x, y, z
#init euler
init_euler: [0.0, 0.0, -0.130823906] # roll, pitch, yaw
#是否发布点云  debug
is_pub_cloud: false
is_pub_map: false
# 输入点云最少点数。低于该值认为当前雷达帧不可用，避免空帧/异常帧进入匹配。
input_cloud_size_thr: 1000

# 当前 scan 经过语义分类后的 VoxelGrid 降采样栅格，单位 m。
# 调小会保留更多 source 点和潜在点对，增强局部几何不足场景下的匹配裕量；
# 调大会降低 CPU，但更容易因为点对不足触发 LOW_ACCURACY/odom 外推。
# bag44/nav45/nav46 验证中 0.15 比 0.20 有效点对更多且质量指标未变差。
source_voxel_leaf_size: 0.15

matching_check_residual_thresh: 0.15
matching_check_valid_pair_ratio_thresh: 0.80
matching_check_prior_xy_thresh: 0.50
matching_check_prior_z_thresh: 0.50
matching_check_prior_yaw_thresh_deg: 8.0
#lidar to vehicle calibration 
lidar_vehicle_xyz: [0.072, -0.004, 1.215]
lidar_vehicle_rpy: [-1.5707963268, 0.0, 1.5707963268]
#ceres solver options
lidar_matcher:
  min_map_size: 50000 # 最少地图点数
  min_pair_size: 200 #100 #500 # 最小有效点对数
  iterations: 4
  validation_thresh: 0.2

  validation_TF_angle_delta_thresh: 1.0 #0.1 
  validation_ave_final_cost_thresh: 0.03 #0.02 # 每点平均cost阈值

  # source cloud filter
  blind_distance: 1.0 # 盲区距离
  leaf_size: 0.1 # VoxelGrid降采样栅格尺寸
  debug_print: false
  # ceres solver options
  num_threads: 2
  max_num_iterations: 2 #10

  # feature
  # 为 source 点在地图 KD-tree 中找近邻时使用的搜索半径，单位 m。
  # 原代码硬编码 0.30m；这里保持默认 0.30m，仅改为可配置。
  # 调大可增加近邻和点对，但可能混入跨结构的错误平面；调小更严格但更容易点对不足。
  neighbor_search_radius: 0.30

  # source 点在地图搜索半径内要求的最少近邻点数；少于该值就不生成有效点对。
  min_point_num: 3

  # 地图近邻点法向量一致性阈值，单位度；越小越严格，越大越容易保留边缘/拐角点对。
  min_angle: 20

  # 每帧最多送入 solver 的有效点对数，用于限制 CPU 峰值。
  # <=0 表示不限流，完全保留旧行为；800/1200 可用于 bag 实验验证限流效果。
  # 当前先设为 0，避免启用限流后改变实机定位行为。
  max_pair_size: 0
