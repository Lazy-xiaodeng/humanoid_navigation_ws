# Build a 2D occupancy map using Fast-LIO as the single trajectory source.
#
# This mode is intentionally different from normal slam_toolbox mapping:
# - no scan matching
# - no loop closure
#
# Reason:
# The navigation stack localizes against the Fast-LIO PCD map. If slam_toolbox
# independently optimizes its 2D pose graph, the 2D /map can become locally
# inconsistent with the PCD used by lidar_localization. In this file slam_toolbox
# only rasterizes scans using the Fast-LIO TF/odom trajectory so the 2D map and
# the PCD remain in the same coordinate system.
slam_toolbox:
  ros__parameters:
    transform_tolerance: 1.0

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    mode: mapping
    scan_topic: /scan
    scan_queue_size: 50

    map_frame: map
    odom_frame: odom
    base_frame: base_footprint

    resolution: 0.05
    min_laser_range: 0.6
    max_laser_range: 20.0
    minimum_time_interval: 0.2
    map_update_interval: 1.0

    # Keep the 2D map tied to the Fast-LIO trajectory.
    use_scan_matching: false
    use_scan_barycenter: false
    do_loop_closing: false

    # Still add nodes often enough for occupancy integration.
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05

    # These are unused when scan matching / loop closure are disabled, but kept
    # explicit so accidental future changes remain obvious.
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 0.0
    loop_match_minimum_chain_size: 999999
    loop_match_maximum_variance_coarse: 0.1
    loop_match_minimum_response_coarse: 1.0
    loop_match_minimum_response_fine: 1.0

    correlation_search_space_dimension: 0.1
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.01

    transform_publish_period: 0.02
