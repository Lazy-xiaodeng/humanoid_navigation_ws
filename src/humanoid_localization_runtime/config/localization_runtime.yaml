# humanoid_localization_runtime 定位运行层参考参数。
# 当前正式导航 launch 里仍以内联参数为准；本文件用于单独调试和后续参数收敛。

prior_map_odom_bridge:
  ros__parameters:
    # 全局地图坐标系；由外部定位输出。
    map_frame: "map"
    # 局部里程计坐标系；通常来自 Fast-LIO。
    odom_frame: "odom"
    # 外部定位消息对应的机器人坐标系。
    localized_frame: "base_footprint"
    # PoseStamped 定位输入话题，兼容历史定位输入。
    prior_pose_topic: "/prior_localization/pose"
    # PoseWithCovarianceStamped 定位输入话题，RViz initialpose 也会转发到这里。
    prior_pose_with_covariance_topic: "/prior_localization/pose_with_covariance"
    # Odometry 定位输入话题，RoboSense 定位链路主要使用它。
    prior_odom_topic: "/prior_localization/odom"
    # 恢复协调器已经审核并计算完成的 map->odom。
    global_recovery_map_to_odom_topic: "/localization/global_recovery_map_to_odom"
    global_recovery_timeout_sec: 2.5
    # map->odom 发布频率，单位 Hz。
    publish_rate: 30.0
    # 是否只保留 x/y/yaw，忽略 z/roll/pitch。
    force_2d: true

dynamic_map_ground_publisher:
  ros__parameters:
    # 父坐标系；发布 map_ground 时为 map。
    parent_frame: "map"
    # 参考机器人坐标系，用于估算当前地面高度。
    base_frame: "base_footprint"
    # 输出地面坐标系。
    child_frame: "map_ground"
    # 发布频率，单位 Hz。
    publish_rate: 30.0

dynamic_odom_ground_publisher:
  ros__parameters:
    # 父坐标系；发布 odom_ground 时为 odom。
    parent_frame: "odom"
    # 参考机器人坐标系。
    base_frame: "base_footprint"
    # 输出地面坐标系。
    child_frame: "odom_ground"
    # 发布频率，单位 Hz。
    publish_rate: 30.0

robot_realpose_publisher:
  ros__parameters:
    # 输出真实位姿使用的全局坐标系。
    global_frame: "map_ground"
    # 机器人底盘坐标系。
    base_frame: "base_footprint"
    # 发布频率，单位 Hz。
    publish_rate: 10.0

rviz_initialpose_adapter:
  ros__parameters:
    # RViz 2D Pose Estimate 输入话题。
    input_topic: "/initialpose"
    # 转发给定位桥的 PoseWithCovarianceStamped 话题。
    bridge_pose_topic: "/prior_localization/pose_with_covariance"
    # 转发给 RoboSense 定位内部状态的手动初始位姿话题。
    robosense_pose_topic: "/prior_localization/manual_initialpose"
    # RViz 使用的地面地图坐标系。
    map_ground_frame: "map_ground"
    # 定位桥使用的地图坐标系。
    map_frame: "map"

global_relocalization_coordinator:
  ros__parameters:
    # off：不搜索；shadow：搜索和记录但不写正式链路；enforce：允许 RO→bridge 正式接管。
    integration_mode: "shadow"
    auto_trigger: true
    # 正式精度层历史 P95 约 21.4s、最大约 27.2s；预留调度余量取 45s。
    attempt_timeout_sec: 45.0
    apply_timeout_sec: 5.0
    max_attempts: 3
    retry_backoff_sec: 2.0
    candidate_stamp_tolerance_sec: 0.03
    candidate_max_receipt_age_sec: 2.0
    # RO 连续精匹配后发布的 refined map->odom；协调器只把该结果交给 bridge。
    robosense_refined_map_odom_topic: "/prior_localization/global_relocalization_refined_map_to_odom"
    navigation_status_topic: "/navigation/status"
    map_assets_json: '{}'
    map_registry_path: "/home/ubuntu/software/Todesk/Files/humanoid_ws/data/maps/map_registry.json"
