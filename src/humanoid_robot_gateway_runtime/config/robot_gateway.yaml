# humanoid_robot_gateway_runtime 机器人本体网关参数。
# 本文件用于配置机器人本体 WebSocket、速度命令、动作控制、状态发布和动作库同步。
# 当前 C++ 包处于分阶段实现阶段，默认关闭真实连接、速度发送和动作执行，避免误控制机器人。
# 上游节点：Nav2/controller 的 /cmd_vel、APP 网关的 /app/robot_control，以及机器人本体 WebSocket 服务。
# 下游节点：data_integration_node、navigation_state_manager、APP 事件链路和动作库热重载链路。

robot_gateway_node:
  ros__parameters:
    # 是否启用真实机器人本体 WebSocket 连接；分阶段验证阶段保持 false，确认状态链路稳定后再打开。
    robot_ws_enable: false

    # 机器人本体 WebSocket 地址；线上协议默认 ws://10.192.1.2:5000。
    robot_ws_server: "ws://10.192.1.2:5000"

    # 断线重连间隔，单位秒。
    reconnect_interval_sec: 5.0

    # 单次命令等待响应超时时间，单位秒。
    command_timeout_sec: 5.0

    # 兜底机器人 accid；默认留空，等待首条机器人回包动态学习真实 accid，避免批量产品写死身份。
    # 如果某台机器人固件不会回传 accid，可临时在这里填写兜底值。
    fallback_accid: ""

    # 兜底机器人 sn；通常为空，连接机器人后从原始消息中学习。
    fallback_sn: ""

    # 是否允许真实发送 /cmd_vel 到机器人本体；接入初期必须保持 false。
    walk_velocity_send_enable: false

    # 行走速度发送频率，单位 Hz；线上协议 walk_command_loop 实际按 50Hz 定频发送。
    walk_velocity_send_rate_hz: 50.0

    # cmd_vel 超时时间，单位秒；超时后应发送零速度保护。
    cmd_vel_timeout_sec: 0.5

    # 是否允许真实执行 APP 上半身动作；接入初期必须保持 false。
    motion_execution_enable: false

    # 执行动作前是否允许自动切换到 Menu 模式。
    motion_allow_enter_menu: false

    # 动作完成后是否允许自动切回 Walk 模式。
    motion_allow_return_walk: false

    # 动作完成默认等待超时时间，单位秒；保持线上协议 default_motion_timeout。
    motion_default_timeout_sec: 25.0

    # 从动作库解析到动作预期时长后，额外增加的安全缓冲时间，单位秒。
    motion_timeout_buffer_sec: 8.0

    # 动作完成等待的最大超时时间，单位秒，避免异常动作名导致无限等待。
    motion_max_timeout_sec: 90.0

    # 是否启用动作库同步；低风险，但会写 gestures.yaml，接入前也应单独验证。
    gesture_sync_enable: false

    # 动作库 YAML 写入路径；留空时自动定位 humanoid_locomotion/config/gestures.yaml。
    # 只有 gesture_sync_enable=true 且 robot_ws_enable=true 时才会写入。
    gestures_yaml_path: ""

    # 连接机器人后延迟多少秒再拉取动作库，避免刚连接时身份和状态消息还未稳定。
    gesture_sync_delay_sec: 2.0

    # 机器人原始状态输出话题。
    robot_status_raw_topic: "/robot_status_raw"

    # 机器人遥控/摇杆输出话题。
    joy_raw_topic: "/joy_raw"

    # 动作执行结果输出话题。
    robot_action_result_topic: "/robot/action_result"

    # 动作库更新通知输出话题。
    gesture_list_updated_topic: "/system/gesture_list_updated"

    # 速度命令输入话题。
    cmd_vel_topic: "/cmd_vel"

    # APP 机器人控制命令输入话题。
    app_robot_control_topic: "/app/robot_control"
